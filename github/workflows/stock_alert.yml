name: Run Stock Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # רץ אוטומטית כל 10 דקות
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI yfinance

      - name: Run alert bot
        run: python alert_bot.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Commit and push if sent_alerts.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent_alerts.json [skip ci]" && git push)
