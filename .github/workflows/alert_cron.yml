name: Run Stock Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # רץ כל 10 דקות
  workflow_dispatch:        # מאפשר הפעלה ידנית מתי שתרצה

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # חובה כדי לאפשר שמירה אוטומטית של הזיכרון לגיטהאב
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI yfinance pytz

      - name: Run alert bot
        run: python alert_bot.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sent_alerts.json
          git commit -m "Update sent alerts memory" || exit 0
          git push
